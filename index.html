<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiRonda — Jadwal Pos Kamling</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
  />
  <style>
    /* ===== Base ===== */
    body {
      font-size: 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1 0 auto;
    }

    /* ===== Header gradient — merah ===== */
    .kml-header {
      background: linear-gradient(135deg, #7f1d1d 0%, #b91c1c 60%, #dc2626 100%);
    }
    .kml-header h1 {
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.35);
    }
    .kml-header p {
      letter-spacing: 1px;
      font-size: 0.82rem;
    }

    /* ===== Override Bootstrap primary → merah ===== */
    .btn-primary {
      --bs-btn-bg: #dc2626;
      --bs-btn-border-color: #dc2626;
      --bs-btn-hover-bg: #b91c1c;
      --bs-btn-hover-border-color: #b91c1c;
      --bs-btn-active-bg: #991b1b;
      --bs-btn-active-border-color: #991b1b;
    }
    .table-primary {
      --bs-table-bg: #fff1f2;
      --bs-table-striped-bg: #ffe4e6;
      color: #7f1d1d;
    }

    /* ===== Navigasi bulan card ===== */
    .kml-nav-card {
      background: #fff;
      border: 1px solid #fecdd3;
      border-radius: 10px;
      padding: 0.75rem 1.25rem;
      box-shadow: 0 1px 4px rgba(220,38,38,0.08);
    }
    #label-bulan {
      min-width: 180px;
      text-align: center;
      color: #991b1b;
    }

    /* ===== Table card wrapper ===== */
    .kml-table-card {
      background: #fff;
      border: 1px solid #fecdd3;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 1px 4px rgba(220,38,38,0.08);
      overflow-x: auto;
    }

    /* ===== Table row hover ===== */
    .table-hover tbody tr:hover td {
      background-color: #fff1f2 !important;
      transition: background-color 0.15s ease;
    }

    /* ===== Daftar Warga grid ===== */
    .kml-warga-card {
      background: #fff;
      border: 1px solid #fecdd3;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      box-shadow: 0 1px 4px rgba(220,38,38,0.08);
    }
    .kml-warga-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 0.6rem;
      border-radius: 8px;
      border: 1px solid #ffe4e6;
      background: #fff5f5;
      font-size: 0.9rem;
    }
    .kml-warga-item .warga-no {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #dc2626;
      color: #fff8f0;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .kml-warga-item .warga-nama {
      font-weight: 500;
      color: #1e293b;
      flex: 1;
    }
    .kml-warga-item .warga-rumah {
      font-size: 0.75rem;
      color: #64748b;
    }

    /* ===== Footer ===== */
    .kml-footer {
      background: #7f1d1d;
      color: #fde8e8;
      font-size: 0.82rem;
      padding: 0.9rem 1rem;
      text-align: center;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    /* ===== Mobile tweaks ===== */
    @media (max-width: 576px) {
      body { font-size: 14px; }
      .kml-header h1 { font-size: 1.15rem; }
      .kml-nav-card { padding: 0.5rem 0.75rem; }
      #label-bulan { min-width: 130px; font-size: 0.95rem; }
      .btn-sm { font-size: 0.8rem; padding: 0.3rem 0.55rem; }
    }
  </style>
</head>
<body class="bg-light">

  <!-- ===== HEADER ===== -->
  <header class="kml-header text-white py-3 shadow-sm">
    <div class="container text-center">
      <h1 class="h3 mb-1 fw-bold">
        <i class="bi bi-shield-shaded me-2"></i>SiRonda
      </h1>
      <p class="mb-0 opacity-90" style="font-size:0.85rem;letter-spacing:0.08em;">Sistem Informasi Ronda Malam</p>
      <p class="mb-1 opacity-90 fw-semibold" style="font-size:1rem;">Kampung Yuwanain</p>
      <p class="mb-0 opacity-75">
        <i class="bi bi-house-fill me-1"></i>RT 05 / RW 03
      </p>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="container my-4">

    <!-- Navigasi Bulan -->
    <div class="d-flex align-items-center justify-content-center gap-3 mb-4">
      <div class="kml-nav-card d-flex align-items-center gap-3">
        <button id="btn-prev" class="btn btn-primary btn-sm" aria-label="Bulan sebelumnya">
          <i class="bi bi-chevron-left"></i> Prev
        </button>
        <span id="label-bulan" class="fw-semibold fs-5">
          <i class="bi bi-calendar3 me-1 text-primary"></i>— Pilih Bulan —
        </span>
        <button id="btn-next" class="btn btn-primary btn-sm" aria-label="Bulan berikutnya">
          Next <i class="bi bi-chevron-right"></i>
        </button>
      </div>
    </div>

    <!-- Kontainer Tabel Jadwal -->
    <div class="kml-table-card mb-4">
      <div id="tabel-container">
        <!-- Tabel jadwal akan di-render oleh JavaScript -->
      </div>
    </div>

    <!-- ===== DAFTAR WARGA ===== -->
    <div class="kml-warga-card mb-4">
      <h5 class="fw-bold mb-3" style="color:#991b1b;">
        <i class="bi bi-people-fill me-2"></i>Daftar Warga
      </h5>
      <div class="row g-2" id="daftar-warga-container">
        <!-- Di-render oleh renderDaftarWarga() -->
      </div>
    </div>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="kml-footer">
    <i class="bi bi-shield-shaded me-1"></i>
    RT 05 / RW 03 &mdash; SiRonda &copy; 2026–2027
  </footer>

  <!-- ===== MODAL EDIT JADWAL (pengurus — checkbox warga) ===== -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-warning">
          <h5 class="modal-title fw-bold" id="editModalLabel">
            <i class="bi bi-pencil-square me-2"></i>Edit Jadwal
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Tanggal</label>
            <input type="text" id="edit-tanggal-display" class="form-control" readonly disabled />
            <input type="hidden" id="edit-tanggal-value" />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Pilih Warga Jaga <small class="text-muted fw-normal">(centang nama)</small></label>
            <div id="edit-warga-checks" class="row g-2 mt-1">
              <!-- Di-generate oleh JS -->
            </div>
          </div>
          <div class="mb-3">
            <label for="edit-shift" class="form-label fw-semibold">Shift</label>
            <select id="edit-shift" class="form-select">
              <option value="21.00–03.00">21.00–03.00</option>
              <option value="20.00–02.00">20.00–02.00</option>
              <option value="22.00–04.00">22.00–04.00</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            <i class="bi bi-x-circle me-1"></i>Batal
          </button>
          <button type="button" class="btn btn-warning fw-semibold" onclick="simpanJadwal()">
            <i class="bi bi-check-circle me-1"></i>Simpan
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== MODAL DAFTARKAN SAYA (warga — pilih nama sendiri) ===== -->
  <div class="modal fade" id="daftarModal" tabindex="-1" aria-labelledby="daftarModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header" style="background:#ffe4e6;">
          <h5 class="modal-title fw-bold" id="daftarModalLabel" style="color:#991b1b;">
            <i class="bi bi-person-check me-2"></i>Daftarkan Saya
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Tanggal</label>
            <input type="text" id="daftar-tanggal-display" class="form-control" readonly disabled />
            <input type="hidden" id="daftar-tanggal-value" />
          </div>
          <div class="mb-3">
            <label for="daftar-nama" class="form-label fw-semibold">Nama Saya</label>
            <select id="daftar-nama" class="form-select">
              <option value="">— Pilih nama Anda —</option>
            </select>
          </div>
          <div id="daftar-info" class="text-muted small mt-1"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            <i class="bi bi-x-circle me-1"></i>Batal
          </button>
          <button type="button" class="btn fw-semibold" style="background:#dc2626;color:#fff8f0;" onclick="simpanDaftarSaya()">
            <i class="bi bi-person-plus me-1"></i>Daftarkan
          </button>
        </div>
      </div>
    </div>
  </div>

      { id: 860, tanggal: "2027-12-26", warga: ["Hendra Wijaya",   "Joko Purnomo",   "Dodi Kurniawan"],  shift: "21.00–03.00" },
      { id: 861, tanggal: "2027-12-27", warga: ["Eko Prasetyo",    "Krisna Mahendra","Irwan Setiawan"],  shift: "21.00–03.00" },
      { id: 862, tanggal: "2027-12-28", warga: ["Gunawan Susanto", "Hadi Sumarno",   "Budi Santoso"],    shift: "21.00–03.00" },
      { id: 863, tanggal: "2027-12-29", warga: ["Agus Priyono",    "Slamet Riyadi",  "Fajar Nugroho"],   shift: "21.00–03.00" },
      { id: 864, tanggal: "2027-12-30", warga: ["Hendra Wijaya",   "Dodi Kurniawan", "Joko Purnomo"],    shift: "21.00–03.00" },
      { id: 865, tanggal: "2027-12-31", warga: ["Eko Prasetyo",    "Irwan Setiawan", "Krisna Mahendra"], shift: "21.00–03.00" },
    ];

    // ---------------------------------------------------------
    // STATE TANGGAL AKTIF
    // currentDate  — objek Date untuk tanggal hari ini
    // currentMonth — bulan yang sedang ditampilkan (0 = Januari)
    // currentYear  — tahun yang sedang ditampilkan
    // Keduanya diinisialisasi ke bulan/tahun saat ini agar
    // halaman langsung menampilkan jadwal bulan yang relevan.
    // ---------------------------------------------------------
    let currentDate  = new Date();
    let currentMonth = currentDate.getMonth();   // Bulan saat ini
    let currentYear  = currentDate.getFullYear();

    // ---------------------------------------------------------
    // KONSTANTA BAHASA INDONESIA
    // ---------------------------------------------------------
    const NAMA_BULAN = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];
    const NAMA_HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];

    // ---------------------------------------------------------
    // FUNGSI renderTabel(bulan, tahun)
    // Merender tabel jadwal untuk bulan & tahun yang diberikan.
    //   bulan — 0-based (0 = Januari, 11 = Desember)
    //   tahun — tahun 4-digit, misal 2026
    // ---------------------------------------------------------
    function renderTabel(bulan, tahun) {
      // 1. Update label navigasi
      document.getElementById("label-bulan").textContent =
        NAMA_BULAN[bulan] + " " + tahun;

      // 2. Hitung jumlah hari dalam bulan ini
      const jumlahHari = new Date(tahun, bulan + 1, 0).getDate();

      // 3. Tanggal hari ini (untuk highlight)
      const hariIni       = new Date();
      const hariIniStr    = hariIni.getFullYear() + "-"
        + String(hariIni.getMonth() + 1).padStart(2, "0") + "-"
        + String(hariIni.getDate()).padStart(2, "0");

      // 4. Build baris tabel
      let baris = "";
      for (let hari = 1; hari <= jumlahHari; hari++) {
        const bulanStr  = String(bulan + 1).padStart(2, "0");
        const hariStr   = String(hari).padStart(2, "0");
        const tanggalStr = tahun + "-" + bulanStr + "-" + hariStr;

        // Cari entri jadwal untuk tanggal ini
        const entri = jadwal.find(j => j.tanggal === tanggalStr);

        // Tentukan class highlight
        const rowClass = tanggalStr === hariIniStr ? " class=\"table-warning\"" : "";

        // Format tampilan tanggal: "01 Jan 2026"
        const tglTampil = hariStr + " " + NAMA_BULAN[bulan].substring(0, 3) + " " + tahun;

        // Nama hari
        const namaHari = NAMA_HARI[new Date(tahun, bulan, hari).getDay()];

        // Kolom isi
        const namaWarga = entri ? entri.warga.join(", ") : "-";
        const shift     = entri ? entri.shift : "-";

        const shiftBadge = entri
          ? "<span class=\"badge bg-secondary\">" + entri.shift + "</span>"
          : "-";

        // Tombol "Daftarkan Saya" selalu muncul di semua baris
        const btnDaftar =
          "<button class=\"btn btn-sm me-1 mb-1\" style=\"background:#dc2626;color:#fff8f0;\" " +
            "onclick=\"daftarkanSaya('" + tanggalStr + "')\">" +
            "<i class=\"bi bi-person-plus me-1\"></i>Daftar Saya" +
          "</button>";

        const aksi = entri
          ? btnDaftar +
            "<button class=\"btn btn-sm btn-warning me-1 mb-1\" onclick=\"editJadwal('" + tanggalStr + "')\">" +
              "<i class=\"bi bi-pencil-square me-1\"></i>Edit" +
            "</button>" +
            "<button class=\"btn btn-sm btn-danger mb-1\" onclick=\"hapusJadwal('" + tanggalStr + "')\">" +
              "<i class=\"bi bi-trash3 me-1\"></i>Hapus" +
            "</button>"
          : btnDaftar +
            "<button class=\"btn btn-sm btn-success mb-1\" onclick=\"tambahJadwal('" + tanggalStr + "')\">" +
              "<i class=\"bi bi-plus-circle me-1\"></i>Tambah" +
            "</button>";

        baris +=
          "<tr" + rowClass + ">" +
            "<td>" + hari + "</td>" +
            "<td>" + tglTampil + "</td>" +
            "<td>" + namaHari + "</td>" +
            "<td>" + namaWarga + "</td>" +
            "<td>" + shiftBadge + "</td>" +
            "<td class=\"text-nowrap\">" + aksi + "</td>" +
          "</tr>";
      }

      // 5. Render tabel ke dalam kontainer
      document.getElementById("tabel-container").innerHTML =
        "<div class=\"table-responsive\">" +
          "<table class=\"table table-striped table-hover table-bordered align-middle\">" +
            "<thead class=\"table-primary\">" +
              "<tr>" +
                "<th>#</th>" +
                "<th>Tanggal</th>" +
                "<th>Hari</th>" +
                "<th>Nama Warga Jaga</th>" +
                "<th>Shift</th>" +
                "<th>Aksi</th>" +
              "</tr>" +
            "</thead>" +
            "<tbody>" + baris + "</tbody>" +
          "</table>" +
        "</div>";
    }

    // ---------------------------------------------------------
    // EVENT LISTENER — Navigasi Prev / Next
    // ---------------------------------------------------------
    document.getElementById("btn-prev").addEventListener("click", function () {
      currentMonth--;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }
      renderTabel(currentMonth, currentYear);
    });

    document.getElementById("btn-next").addEventListener("click", function () {
      currentMonth++;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }
      renderTabel(currentMonth, currentYear);
    });

    // ---------------------------------------------------------
    // FUNGSI editJadwal(tanggal)
    // Cari entri di array jadwal berdasarkan tanggal, isi form
    // modal, lalu buka modal.
    // ---------------------------------------------------------
    // ---------------------------------------------------------
    // HELPER: Render checkbox daftar warga ke dalam kontainer
    // ---------------------------------------------------------
    function renderWargaChecks(terpilih) {
      const container = document.getElementById("edit-warga-checks");
      container.innerHTML = warga.map(function (w) {
        const checked = terpilih.includes(w.nama) ? "checked" : "";
        return (
          "<div class=\"col-12 col-sm-6 col-md-4\">" +
            "<div class=\"form-check border rounded px-3 py-2\" style=\"background:#fff5f5;\">" +
              "<input class=\"form-check-input\" type=\"checkbox\" value=\"" + w.nama + "\" " +
                "id=\"chk-" + w.id + "\" " + checked + ">" +
              "<label class=\"form-check-label\" for=\"chk-" + w.id + "\">" +
                w.nama +
              "</label>" +
            "</div>" +
          "</div>"
        );
      }).join("");
    }

    // ---------------------------------------------------------
    // HELPER: Ambil nama warga yang dicentang dari checkbox
    // ---------------------------------------------------------
    function getCheckedWarga() {
      return Array.from(
        document.querySelectorAll("#edit-warga-checks input[type=checkbox]:checked")
      ).map(function (el) { return el.value; });
    }

    // ---------------------------------------------------------
    // FUNGSI editJadwal(tanggal)
    // ---------------------------------------------------------
    function editJadwal(tanggal) {
      const entri = jadwal.find(j => j.tanggal === tanggal);
      if (!entri) return;

      const [thn, bln, hr] = tanggal.split("-");
      document.getElementById("edit-tanggal-display").value =
        hr + " " + NAMA_BULAN[parseInt(bln, 10) - 1] + " " + thn;
      document.getElementById("edit-tanggal-value").value = tanggal;

      // Render checkbox dengan nama yg sudah ada dicentang
      renderWargaChecks(entri.warga);

      document.getElementById("edit-shift").value = entri.shift;

      document.getElementById("editModalLabel").innerHTML =
        "<i class=\"bi bi-pencil-square me-2\"></i>Edit Jadwal";

      bootstrap.Modal.getOrCreateInstance(document.getElementById("editModal")).show();
    }

    // ---------------------------------------------------------
    // FUNGSI tambahJadwal(tanggal)
    // ---------------------------------------------------------
    function tambahJadwal(tanggal) {
      const [thn, bln, hr] = tanggal.split("-");
      document.getElementById("edit-tanggal-display").value =
        hr + " " + NAMA_BULAN[parseInt(bln, 10) - 1] + " " + thn;
      document.getElementById("edit-tanggal-value").value = tanggal;

      // Render checkbox kosong semua
      renderWargaChecks([]);
      document.getElementById("edit-shift").value = "21.00–03.00";

      document.getElementById("editModalLabel").innerHTML =
        "<i class=\"bi bi-plus-circle me-2\"></i>Tambah Jadwal";

      bootstrap.Modal.getOrCreateInstance(document.getElementById("editModal")).show();
    }

    // ---------------------------------------------------------
    // FUNGSI simpanJadwal()
    // ---------------------------------------------------------
    function simpanJadwal() {
      const tanggal   = document.getElementById("edit-tanggal-value").value;
      const shiftInput = document.getElementById("edit-shift").value;
      const namaWarga = getCheckedWarga();

      if (namaWarga.length === 0) {
        alert("Pilih minimal satu warga jaga!");
        return;
      }

      const idx = jadwal.findIndex(j => j.tanggal === tanggal);
      if (idx === -1) {
        const newId = jadwal.length > 0 ? Math.max(...jadwal.map(j => j.id)) + 1 : 1;
        jadwal.push({ id: newId, tanggal: tanggal, warga: namaWarga, shift: shiftInput });
      } else {
        jadwal[idx].warga = namaWarga;
        jadwal[idx].shift = shiftInput;
      }

      bootstrap.Modal.getOrCreateInstance(document.getElementById("editModal")).hide();
      renderTabel(currentMonth, currentYear);
    }

    // ---------------------------------------------------------
    // FUNGSI daftarkanSaya(tanggal)
    // Warga pilih nama sendiri dari dropdown, lalu ditambahkan
    // ke jadwal tanggal tersebut (tidak menghapus nama lain)
    // ---------------------------------------------------------
    function daftarkanSaya(tanggal) {
      const [thn, bln, hr] = tanggal.split("-");
      document.getElementById("daftar-tanggal-display").value =
        hr + " " + NAMA_BULAN[parseInt(bln, 10) - 1] + " " + thn;
      document.getElementById("daftar-tanggal-value").value = tanggal;

      // Isi dropdown nama warga
      const sel = document.getElementById("daftar-nama");
      sel.innerHTML = "<option value=\"\">— Pilih nama Anda —</option>" +
        warga.map(function (w) {
          return "<option value=\"" + w.nama + "\">" + w.nama + "</option>";
        }).join("");

      // Tampilkan info warga yang sudah terdaftar
      const entri = jadwal.find(j => j.tanggal === tanggal);
      const infoEl = document.getElementById("daftar-info");
      if (entri && entri.warga.length > 0) {
        infoEl.innerHTML = "<i class=\"bi bi-people me-1\"></i>Sudah terdaftar: <strong>" +
          entri.warga.join(", ") + "</strong>";
      } else {
        infoEl.textContent = "Belum ada warga yang terdaftar untuk tanggal ini.";
      }

      bootstrap.Modal.getOrCreateInstance(document.getElementById("daftarModal")).show();
    }

    // ---------------------------------------------------------
    // FUNGSI simpanDaftarSaya()
    // Tambahkan nama warga terpilih ke jadwal (tidak overwrite)
    // ---------------------------------------------------------
    function simpanDaftarSaya() {
      const tanggal = document.getElementById("daftar-tanggal-value").value;
      const nama    = document.getElementById("daftar-nama").value;

      if (!nama) {
        alert("Silakan pilih nama Anda terlebih dahulu!");
        return;
      }

      const idx = jadwal.findIndex(j => j.tanggal === tanggal);
      if (idx === -1) {
        // Buat entri baru
        const newId = jadwal.length > 0 ? Math.max(...jadwal.map(j => j.id)) + 1 : 1;
        jadwal.push({ id: newId, tanggal: tanggal, warga: [nama], shift: "21.00–03.00" });
      } else {
        // Tambahkan ke daftar jika belum ada
        if (jadwal[idx].warga.includes(nama)) {
          alert(nama + " sudah terdaftar di jadwal ini!");
          return;
        }
        jadwal[idx].warga.push(nama);
      }

      bootstrap.Modal.getOrCreateInstance(document.getElementById("daftarModal")).hide();
      renderTabel(currentMonth, currentYear);
    }

    // ---------------------------------------------------------
    // FUNGSI hapusJadwal(tanggal)
    // Tampilkan konfirmasi, jika ya hapus entri dari array jadwal
    // lalu re-render tabel.
    // ---------------------------------------------------------
    function hapusJadwal(tanggal) {
      const entri = jadwal.find(j => j.tanggal === tanggal);
      if (!entri) return;

      const [thn, bln, hr] = tanggal.split("-");
      const tglLabel = hr + " " + NAMA_BULAN[parseInt(bln, 10) - 1] + " " + thn;

      if (!confirm("Hapus jadwal tanggal " + tglLabel + "?\n\nTindakan ini tidak dapat dibatalkan.")) return;

      jadwal = jadwal.filter(j => j.tanggal !== tanggal);
      renderTabel(currentMonth, currentYear);
    }

    // ---------------------------------------------------------
    // FUNGSI renderDaftarWarga()
    // Render kartu grid daftar warga ke dalam #daftar-warga-container
    // ---------------------------------------------------------
    function renderDaftarWarga() {
      const container = document.getElementById("daftar-warga-container");
      if (!container) return;
      container.innerHTML = warga.map(function (w) {
        return (
          "<div class=\"col-12 col-sm-6 col-md-4 col-lg-3\">" +
            "<div class=\"kml-warga-item\">" +
              "<span class=\"warga-no\">" + w.noRumah + "</span>" +
              "<span class=\"warga-nama\">" + w.nama + "</span>" +
              "<span class=\"warga-rumah\"><i class=\"bi bi-house me-1\"></i>No." + w.noRumah + "</span>" +
            "</div>" +
          "</div>"
        );
      }).join("");
    }

    // ---------------------------------------------------------
    // INIT — Render tabel saat halaman pertama kali dimuat
    // ---------------------------------------------------------
    renderTabel(currentMonth, currentYear);
    renderDaftarWarga();

  </script>
